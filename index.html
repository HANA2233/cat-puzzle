<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小猫 3×3 拼图</title>
<style>
  :root {
    --bg: #f4efe6;
    --ink: #3a2a22;
    --card: #fffdf8;
    --line: #e4d5c4;
    --accent: #e07a3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at top, #fff7ec 0%, var(--bg) 55%, #efe4d4 100%);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: min(100%, 480px);
    padding: 22px 16px 32px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .sub {
    margin: 0 0 16px;
    color: #7a6558;
    font-size: 14px;
    line-height: 1.5;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
  }
  button {
    border: 0;
    background: var(--accent);
    color: white;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
  }
  button.ghost {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .board-wrap {
    background: var(--card);
    border-radius: 22px;
    padding: 12px;
    box-shadow: 0 10px 30px rgba(90, 55, 30, 0.08);
  }
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: #f7f1ea;
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
  }

      <p>原图在左边。右下角是空位，只能移动和空位相邻的图片。</p>
    </div>
  </div>
<script>
const N = 3;
const board = document.getElementById("board");
const movesEl = document.getElementById("moves");
const winEl = document.getElementById("win");
let tiles = [];
let empty = 8;
let moves = 0;
let lockPeek = false;

function pos(i) {
  return { x: i % N, y: Math.floor(i / N) };
}

function render() {
  board.innerHTML = "";
  tiles.forEach((id, i) => {
    const el = document.createElement("div");
    el.className = "tile" + (id === 8 ? " empty" : "");
    const p = pos(i);
    el.style.transform = "translate(" + (p.x * 100) + "%," + (p.y * 100) + "%)";
    if (id !== 8) {
      const src = pos(id);
      el.style.backgroundPosition = (src.x * 50) + "% " + (src.y * 50) + "%";
      el.addEventListener("click", () => slide(i));
    }
    board.appendChild(el);
  });
  movesEl.textContent = moves;
  const solved = tiles.every((id, i) => id === i);
  winEl.classList.toggle("show", solved && moves > 0);
}

function neighbors(i) {
  const p = pos(i);
  const out = [];
  if (p.x > 0) out.push(i - 1);
  if (p.x < N - 1) out.push(i + 1);
  if (p.y > 0) out.push(i - N);
  if (p.y < N - 1) out.push(i + N);
  return out;
}

function slide(i) {
  if (!neighbors(empty).includes(i)) return;
  tiles[empty] = tiles[i];
  tiles[i] = 8;
  empty = i;
  moves += 1;
  render();
}

function shuffle() {
  tiles = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  empty = 8;
  moves = 0;
  let guard = 0;
  while (guard < 80 || tiles.every((id, i) => id === i)) {
    const opts = neighbors(empty);
    const pick = opts[Math.floor(Math.random() * opts.length)];
    tiles[empty] = tiles[pick];
    tiles[pick] = 8;
    empty = pick;
    guard += 1;
    if (guard > 200) break;
  }
  render();
}

document.getElementById("shuffle").onclick = shuffle;
document.getElementById("peek").onclick = () => {
  if (lockPeek) return;
  const saved = tiles.slice();
  const savedEmpty = empty;
  const savedMoves = moves;
  tiles = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  empty = 8;
  moves = savedMoves;
  render();
  winEl.classList.remove("show");
  lockPeek = true;
  setTimeout(() => {
    tiles = saved;
    empty = savedEmpty;
    moves = savedMoves;
    lockPeek = false;
    render();
  }, 900);
};
shuffle();
</script>
